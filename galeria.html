  <!-- ================================================================
       HERO — MIRADAS
       Apertura editorial, fotográfica y silenciosa.
       La sensación al entrar: "Antes de enseñarte las fotografías,
       te enseñamos a mirar." Composición en dos ejes editoriales:
       IZQUIERDA — identificación, declaración principal y manifiesto.
       DERECHA — fotografía protagonista, categoría y CTA de entrada.
       La tipografía y el encuadre se encuentran sin que el texto
       llegue a vivir sobre la imagen.
       ================================================================ -->
  <section class="gal-hero" id="hero">

    <!-- Fondo: negro profundo + textura papel + grano fino -->
    <div class="gal-hero__bg" aria-hidden="true"></div>

    <!-- Presencia cálida casi imperceptible, zona inferior izquierda -->
    <div class="gal-hero__glow" aria-hidden="true"></div>

    <div class="gal-hero__visual">

      <!-- 01 — Identificador editorial -->
      <span class="gal-hero__overline" data-ch="0">Miradas</span>
      <span class="gal-hero__index" data-ch="1">01 / Galería</span>

      <!-- 02 — Titular principal -->
      <h1 class="gal-hero__title">
        <span class="gal-hero__line" data-ch="3">Hay cosas</span>
        <span class="gal-hero__line" data-ch="3">que solo existen</span>
        <span class="gal-hero__line gal-hero__line--indent" data-ch="4">cuando alguien</span>
        <span class="gal-hero__line gal-hero__line--emotive" data-ch="4">las mira.</span>
      </h1>

      <!-- 03 — Marco fotográfico protagonista: imagen + categoría + CTA.
           @FOTO: la superficie usa un fallback editorial; reemplázalo por la
           fotografía real en assets/css/gallery-page.css (bloque .gal-hero__image). -->
      <figure class="gal-hero__frame" data-ch="2">
        <a class="gal-hero__image-link" href="#galeria" aria-label="Entrar en la galería">
          <div class="gal-hero__image" role="img" aria-label="Vista previa de la galería — Diana &amp; Sans"></div>
          <span class="gal-hero__encuadre" aria-hidden="true"></span>
        </a>
        <!-- 05 — Categoría de la galería -->
        <figcaption class="gal-hero__caption" data-ch="6">Cartago · Momentos</figcaption>
        <!-- 05b — CTA de entrada -->
        <a class="gal-hero__cta" href="#galeria" data-ch="8">
          Entrar en la galería
          <span class="gal-hero__cta-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </figure>

      <!-- 04 — Microcopy: manifiesto corto -->
      <p class="gal-hero__copy" data-ch="5">
        No guardamos imágenes<br>
        para recordar cómo era.<br>
        <span class="gal-hero__copy-break"></span>
        Las guardamos para recordar<br>
        cómo se sentía.
      </p>

      <!-- 06 — Indicador de scroll — discreto, solo línea vertical -->
      <div class="gal-hero__scroll" data-ch="7">
        <span class="gal-hero__scroll-line">
          <span class="gal-hero__scroll-pulse"></span>
        </span>
      </div>

    </div>

  </section>

  <script src="assets/js/main.js"></script>

  <!-- Entrada cinematográfica del hero — Galería -->
  <script>
    (function() {
      'use strict';
      var hero = document.querySelector('.gal-hero');
      if (!hero) return;

      requestAnimationFrame(function() {
        setTimeout(function() {
          hero.classList.add('is-loaded');
        }, 150);
      });

      var items = document.querySelectorAll('.gal-hero [data-ch]');
      var times = [0, 250, 500, 800, 1150, 1600, 2050, 2550, 2750];

      items.forEach(function(el) {
        var i = parseInt(el.getAttribute('data-ch'), 10);
        var delay = (times[i] !== undefined) ? times[i] : 2700;
        setTimeout(function() {
          el.classList.add('is-visible');
        }, delay);
      });
    })();
  </script>
