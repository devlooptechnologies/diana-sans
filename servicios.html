  <!-- ================================================================
       HERO — SERVICIOS
       "Todo lo que necesitas para sentirte como en casa."
       Apertura editorial silenciosa. Dos grandes áreas: a la izquierda
       la promesa de la estancia, a la derecha la pieza visual que la
       sostiene. Espacio negativo, alineaciones precisas y líneas finas.
       @FOTO: el placeholder (.srv-hero__image) se reemplaza por la
       fotografía real en assets/css/servicios-page.css sin tocar el
       layout.
       ================================================================ -->
  <section class="srv-hero" id="hero">

    <!-- Fondo: negro profundo + textura papel + grano fino -->
    <div class="srv-hero__bg" aria-hidden="true"></div>

    <div class="srv-hero__visual">

      <!-- Identificador editorial — superior izquierda -->
      <span class="srv-hero__overline" data-sr="0">Servicios</span>

      <!-- Numeración — superior derecha, mismo lenguaje que 01 / Galería -->
      <span class="srv-hero__index" data-sr="1">01 / Servicios</span>

      <div class="srv-hero__layout">

        <!-- Contenido editorial — izquierda -->
        <div class="srv-hero__content">
          <h1 class="srv-hero__title" data-sr="2">
            <span class="srv-hero__title-line">Todo lo que necesitas</span>
            <span class="srv-hero__title-line srv-hero__title-line--em">para sentirte como en casa.</span>
          </h1>
          <p class="srv-hero__lede" data-sr="3">
            Una estancia pensada para que llegues,<br>
            te instales y simplemente disfrutes.
          </p>
          <!-- Detalle editorial — línea dorada + frase en serif itálica -->
          <div class="srv-hero__detail" data-sr="4">
            <span class="srv-hero__detail-mark" aria-hidden="true"></span>
            <span class="srv-hero__detail-text">Pensado para quedarse.</span>
          </div>
        </div>

        <!-- Pieza visual — derecha -->
        <figure class="srv-hero__frame" data-sr="5">
          <a class="srv-hero__image-link" href="#" aria-label="Fotografía de Diana &amp; Sans — Cartago, Valle del Cauca">
            <div class="srv-hero__image" role="img" aria-label="Espacio reservado para la fotografía principal — Diana &amp; Sans"></div>
          </a>
          <!-- Referencia editorial — esquina inferior derecha de la imagen -->
          <figcaption class="srv-hero__caption" data-sr="6">Cartago · Diana &amp; Sans</figcaption>
        </figure>

      </div>

    </div>

  </section>

  <script src="assets/js/main.js"></script>

  <!-- Entrada cinematográfica del hero — Servicios -->
  <script>
    (function() {
      'use strict';
      var hero = document.querySelector('.srv-hero');
      if (!hero) return;

      requestAnimationFrame(function() {
        setTimeout(function() {
          hero.classList.add('is-loaded');
        }, 150);
      });
    })();
  </script>
</body>
