  <!-- ================================================================
       HERO — MOMENTOS
       Editorial boutique. Memoria y momentos.
       Composición deliberadamente asimétrica.
       ================================================================ -->
  <section class="mom-hero" id="hero">

    <!-- Fondo: negro profundo + textura papel + grano -->
    <div class="mom-hero__bg" aria-hidden="true"></div>

    <!-- Glow cálido tenue, asimétrico, desde el extremo inferior izquierdo -->
    <div class="mom-hero__glow" aria-hidden="true"></div>

    <!-- Capa de fotografía futura — lista para aceptar imagen sin reconstruir el layout -->
    <div class="mom-hero__photo" aria-hidden="true"></div>

    <!-- Eje editorial — única intervención gráfica -->
    <span class="mom-hero__axis" aria-hidden="true"></span>

    <!-- Numeración de revista -->
    <span class="mom-hero__index" data-hr="0">01 / Experiencias</span>

    <div class="mom-hero__inner">

      <div class="mom-hero__top">
        <span class="mom-hero__overline" data-hr="1">Momentos</span>

        <h1 class="mom-hero__title">
          <span class="mom-hero__line" data-hr="2">Hay lugares<br>que se visitan.</span>
          <span class="mom-hero__line mom-hero__line--spaced" data-hr="3">Y otros</span>
          <span class="mom-hero__line mom-hero__line--emotive" data-hr="4">que se recuerdan.</span>
        </h1>
      </div>

      <div class="mom-hero__spacer" aria-hidden="true"></div>

      <div class="mom-hero__baseline">
        <p class="mom-hero__copy" data-hr="5">
          Una estancia no se mide<br>
          solo en noches.<br>
          <span class="mom-hero__copy-break"></span>
          Se mide en los momentos<br>
          que permanecen después.
        </p>

        <div class="mom-hero__scroll" data-hr="6">
          <span class="mom-hero__scroll-text">Descubrir</span>
          <span class="mom-hero__scroll-line">
            <span class="mom-hero__scroll-pulse"></span>
          </span>
        </div>
      </div>

    </div>
  </section>

  <script src="assets/js/main.js"></script>

  <!-- Entrada cinematográfica del hero -->
  <script>
    (function() {
      'use strict';
      var hero = document.querySelector('.mom-hero');
      if (!hero) return;

      requestAnimationFrame(function() {
        setTimeout(function() {
          hero.classList.add('is-loaded');
        }, 150);
      });

      var items = document.querySelectorAll('[data-hr]');
      var times = [300, 550, 900, 1500, 2050, 2600, 3200];

      items.forEach(function(el) {
        var i = parseInt(el.getAttribute('data-hr'), 10);
        var delay = (times[i] !== undefined) ? times[i] : 3200;
        setTimeout(function() {
          el.classList.add('is-shown');
        }, delay);
      });
    })();
  </script>
